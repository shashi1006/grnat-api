apiVersion: apps/v1
kind: Deployment
metadata:
  name: readygeneration-api
  labels:
    app: readygeneration-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: readygeneration-api
  template:
    metadata:
      labels:
        app: readygeneration-api
    spec:
      containers:
        - name: api
          image: readygeneration/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: readygeneration-secrets
            - configMapRef:
                name: readygeneration-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
